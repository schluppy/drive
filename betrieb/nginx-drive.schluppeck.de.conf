# Reverse Proxy für Drive (Nginx auf dem Host).
# Einrichten bzw. austauschen (als root):
#   cp /opt/drive/betrieb/nginx-drive.schluppeck.de.conf /etc/nginx/sites-available/drive.schluppeck.de
#   ln -s /etc/nginx/sites-available/drive.schluppeck.de /etc/nginx/sites-enabled/   # nur bei Neueinrichtung
#   Bei Neueinrichtung zuerst nur den Block für Port 80 aktiv lassen, Zertifikat holen:
#   certbot certonly --webroot -w /var/www/html -d drive.schluppeck.de
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name drive.schluppeck.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drive.schluppeck.de;

    ssl_certificate     /etc/letsencrypt/live/drive.schluppeck.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.schluppeck.de/privkey.pem;

    client_max_body_size 64m;   # Fahrzeugfotos und DriveNote-Backups

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;            # Import großer Backups
    }
}
